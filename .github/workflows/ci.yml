name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Hardhat tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: package-lock.json }
      - run: npm ci
      - run: npx hardhat compile
      - run: npx hardhat test
      - name: ABI is in sync with backend/frontend copies
        run: |
          npm run export-abi
          git diff --exit-code -- backend/src/abi/ChitChain.json frontend/lib/abi/ChitChain.json

  backend:
    name: Backend (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
        env: { DATABASE_URL: "postgres://ci:ci@localhost:5432/ci" }   # prisma generate only needs the var present
      - run: npx prisma validate
        env: { DATABASE_URL: "postgres://ci:ci@localhost:5432/ci" }
      - run: npm run typecheck
      - run: npm test
        env: { DATABASE_URL: "postgres://ci:ci@localhost:5432/ci" }

  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: No MSTC / fiat symbols in the UI
        run: |
          ! grep -rn "MSTC\|₹" app components hooks lib
