name: Deploy to Railway

# Continuous deployment: after CI passes on main, upload backend and frontend to Railway.
# Requires the repository secret RAILWAY_TOKEN (a Railway *project token* for the production environment).

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check secret
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then echo "RAILWAY_TOKEN secret is not set"; exit 1; fi
      - name: Deploy backend
        working-directory: backend
        run: npx -y @railway/cli up --service backend --environment production --ci
      - name: Deploy frontend
        working-directory: frontend
        run: npx -y @railway/cli up --service frontend --environment production --ci
      - name: Smoke check
        run: |
          for i in $(seq 1 30); do
            if curl -sf https://backend-production-64738.up.railway.app/health | grep -q '"ok":true'; then echo "backend healthy"; break; fi
            sleep 10
          done
          curl -sf -o /dev/null https://frontend-production-d322.up.railway.app/ && echo "frontend up"
